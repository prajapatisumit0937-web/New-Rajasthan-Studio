<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        NRS Admin Login
    </title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body class="login-page">


    <div class="login-box">


        <div class="login-logo">
            NRS
        </div>


        <h1>
            Admin Login
        </h1>


        <p>
            New Rajasthan Studio
        </p>


        <form id="loginForm">


            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >

                Login

            </button>


            <p
                id="loginMessage"
                class="login-message"
            ></p>


        </form>


    </div>


    <script src="login.js"></script>

</body>

</html>
