<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
}

.error-box h1{
font-size:120px;
color:#d4af37;
margin:0;
}

.error-box h2{
font-size:35px;
margin:15px 0;
}

.error-box p{
color:#bbb;
margin-bottom:30px;
}

.error-box a{
display:inline-block;
padding:15px 35px;
background:#d4af37;
color:#000;
text-decoration:none;
border-radius:40px;
font-weight:bold;
transition:.3s;
}

.error-box a:hover{
transform:translateY(-3px);
box-shadow:0 0 20px #d4af37;
}

</style>

</head>

<body>

<div class="error-box">

<h1>404</h1>

<h2>Page Not Found</h2>

<p>
Sorry, the page you are looking for doesn't exist.
</p>

<a href="index.html">
Go Back Home
</a>

</div>

</body>
</html>
